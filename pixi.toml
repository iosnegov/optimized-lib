[workspace]
authors = ["Ilya Snegov <unweariedheart@gmail.com>"]
name = "optimized-lib"
version = "0.1.0"
license = "MIT-0"
repository = "https://github.com/snegoviol/optimized-lib"

channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82.0"

[tasks]

[dependencies]
python = ">=3.13.7,<3.14"
pandas = ">=2.3.3,<3"
numpy = ">=2.3.3,<3"
scikit-learn = ">=1.7.2,<2"
huggingface_hub = ">=0.35.3,<0.36"
joblib = ">=1.5.2,<2"
cython = ">=3.1.4,<4"

[feature.build.dependencies]
gcc_linux-64 = ">=15.1.0,<16"

[feature.build.pypi-dependencies]
build = "*"

[feature.test.dependencies]
python = ">=3.13.7,<3.14"
pip = ">=25.2,<26"
jupyter = ">=1.1.1,<2"
pytest-cov = "*"

[environments]
build-env = ["build"]
test-env = { features = ["test"], no-default-feature = true }

[feature.build.tasks]
build-lib = "python -m build"

[feature.test.tasks]
install-lib = "python -m pip install --force-reinstall dist/optimized_lib-*.whl"
test-lib = "pytest tests/test_lib.py --cov=optimized_lib --cov-report=term-missing -W ignore::DeprecationWarning"